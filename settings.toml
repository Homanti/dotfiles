config_version = 16

[bar.default]
center = [ "workspaces" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.0500000081956387
start = [ "launcher", "wallpaper", "date", "clock" ]

[dock]
auto_hide = true
enabled = true
reserve_space = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
force = true
temperature_day = 10000
temperature_night = 9900

[osd]
position = "top_right"

    [osd.kinds]
    lock_keys = false

[shell]
avatar_path = "/home/homanti/Pictures/ava.jpg"

[theme]
builtin = "Kanagawa"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "niri", "qt" ]
    community_ids = [ "sonora", "bat", "fzf" ]

[wallpaper.default]
path = "/home/homanti/Pictures/Wallpapers/arch chan.png"

[wallpaper.last]
path = "/home/homanti/Pictures/Wallpapers/arch chan.png"

[wallpaper.monitors.DP-3]
path = "/home/homanti/Pictures/Wallpapers/arch chan.png"

[widget.network]
show_label = false