[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml"
]

[font]
size = 16.0

[window]
opacity = 0.98

[cursor]
style = { shape = "Beam" }

[window.padding]
x = 8
y = 8

[font.normal]
family = "Hasklug Nerd Font"
style = "Regular"

[font.bold]
family = "Hasklug Nerd Font"
style = "Bold"

[font.italic]
family = "Hasklug Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hasklug Nerd Font"
style = "Bold Italic"
